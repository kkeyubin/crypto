name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      CRYPTO_TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci-test-postgres-password@127.0.0.1:5432/crypto_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: crypto_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crypto_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e './services/api[dev]'
      - run: pytest -q
        working-directory: services/api
      - run: ruff check src tests
        working-directory: services/api
      - run: alembic -c alembic.ini heads
        working-directory: services/api
      - run: python -c "import crypto_research.api; import crypto_research.market.__main__"
        working-directory: services/api
      - run: python scripts/export_schemas.py --check
        working-directory: services/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run contracts:test-generation
      - run: npm run contracts:check-types
      - run: npm run contracts:types
      - run: git diff --exit-code contracts
      - run: npm run web:test -- --run
      - run: npm run web:build

  containers:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      CRYPTO_SESSION_SECRET: ci-session-secret-that-is-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile server -f deploy/compose.yaml config --quiet
      - run: docker compose --profile server -f deploy/compose.yaml up -d postgres
      - run: docker compose --profile server -f deploy/compose.yaml run --rm api true
      - run: docker build --no-cache -f deploy/api.Dockerfile .
      - run: docker build --no-cache -f deploy/web.Dockerfile .
      - if: always()
        run: docker compose --profile server -f deploy/compose.yaml down -v
